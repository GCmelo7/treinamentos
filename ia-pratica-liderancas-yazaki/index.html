<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0B2D63">
<meta name="description" content="Laboratório IA na Prática: do problema real ao projeto com IA, para lideranças Yazaki (In Company IEL-PE).">
<title>Laboratório IA na Prática</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700;800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: caderno de bancada mobile — roteiro (home) + uma missão por tela, com blocos SABER → FAZER → CHECKPOINT */
:root{
  --navy:#0B2D63; --navy-2:#173A75;
  --violet:#5302DD; --violet-2:#8956F9; --violet-soft:#F0ECFD; --violet-line:#DCD2FB;
  --red:#D71920;
  --ground:#F4F5FA; --paper:#FFFFFF; --ink:#1D2433; --muted:#5B6478; --line:#E2E5EE;
  --ok:#0F8A5F; --ok-soft:#E3F5EE; --warn:#B4610A; --warn-soft:#FFF2E2;
  --c0:#0B2D63; --c1:#2563EB; --c2:#0F8A5F; --c3:#E07A12; --c4:#5302DD; --c5:#D71920;
  --f-display:"Montserrat", "Segoe UI", Arial, sans-serif;
  --f-body:"IBM Plex Sans", "Segoe UI", Roboto, Arial, sans-serif;
  --f-mono:"IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
  --r:14px;
  color-scheme:light;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--ground);color:var(--ink);font:400 16px/1.55 var(--f-body)}
button,input,textarea{font:inherit;color:inherit}
a{color:var(--violet)}
h1,h2,h3,h4{font-family:var(--f-display);color:var(--navy);margin:0;text-wrap:balance;line-height:1.18}
p{margin:0}
.wrap{max-width:720px;margin:0 auto;padding-inline:16px}
:focus-visible{outline:3px solid var(--violet-2);outline-offset:2px;border-radius:6px}

/* Top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--navy);color:#fff}
.top .wrap{display:flex;align-items:center;gap:12px;min-height:54px}
.brand{display:flex;flex-direction:column;line-height:1.1;cursor:pointer;background:none;border:0;padding:0;text-align:left;color:#fff}
.brand b{font:800 15px/1.1 var(--f-display);letter-spacing:.04em;white-space:nowrap}
.brand small{font:500 11px/1.2 var(--f-body);opacity:.75;letter-spacing:.04em}
.dots{margin-left:auto;display:flex;gap:5px}
.dot{width:30px;height:30px;flex:0 0 30px;border-radius:50%;border:2px solid rgba(255,255,255,.35);background:transparent;color:#fff;font:700 12px var(--f-display);display:grid;place-items:center;cursor:pointer;padding:0}
.dot.done{background:#fff;color:var(--navy);border-color:#fff}
.dot.cur{border-color:var(--violet-2);box-shadow:0 0 0 3px rgba(137,86,249,.45)}
.bar{height:4px;background:rgba(255,255,255,.15)}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--violet-2),#fff);transition:width .4s}

main{padding-block:20px 120px}

/* HOME */
.hero{background:var(--paper);border-radius:var(--r);padding:22px 20px;border:1px solid var(--line);position:relative;overflow:hidden}
.hero:after{content:"";position:absolute;right:-60px;top:-60px;width:200px;height:200px;border-radius:50%;background:radial-gradient(circle,var(--violet-soft),transparent 70%)}
.eyebrow{font:700 11px/1 var(--f-display);letter-spacing:.14em;text-transform:uppercase;color:var(--red)}
.hero h1{font-size:clamp(28px,7vw,40px);font-weight:800;margin:10px 0 10px;position:relative}
.hero h1 em{font-style:normal;color:var(--violet)}
.hero p{color:var(--muted);max-width:52ch;position:relative}
.meta-row{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px;position:relative}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:5px 11px;font:600 12px/1 var(--f-display);background:var(--violet-soft);color:var(--violet)}
.pill.navy{background:#E7ECF5;color:var(--navy)}
.pill.red{background:#FDE8E9;color:var(--red)}

.how{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}
.how div{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:12px}
.how b{display:block;font:800 13px var(--f-display);color:var(--navy);margin-bottom:2px}
.how span{font-size:13px;color:var(--muted);line-height:1.35;display:block}
@media (max-width:460px){.how{grid-template-columns:1fr}}

.sec-title{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin:28px 0 12px}
.sec-title h2{font-size:20px}
.sec-title span{font:600 12px var(--f-display);color:var(--muted)}

.route{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.step{display:grid;grid-template-columns:52px 1fr auto;gap:12px;align-items:center;background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:14px;cursor:pointer;text-align:left;width:100%}
.step:hover{border-color:var(--violet-line)}
.num{width:52px;height:52px;border-radius:12px;display:grid;place-items:center;color:#fff;font:800 20px var(--f-display);background:var(--mc,var(--navy))}
.step h3{font-size:16px}
.step p{font-size:13.5px;color:var(--muted);margin-top:2px;line-height:1.4}
.tags{display:flex;flex-wrap:wrap;gap:5px;margin-top:7px}
.tag{font:600 10.5px/1 var(--f-display);letter-spacing:.04em;text-transform:uppercase;padding:4px 7px;border-radius:5px;background:#EEF1F7;color:var(--navy-2)}
.state{font:700 11px var(--f-display);text-align:right;color:var(--muted);white-space:nowrap}
.state.done{color:var(--ok)}
.state.here{color:var(--violet)}
.min{display:block;font:800 15px var(--f-display);color:var(--navy)}

.cta{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}
.btn{appearance:none;border:0;border-radius:12px;padding:13px 18px;font:700 15px var(--f-display);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;min-height:48px}
.btn.primary{background:var(--violet);color:#fff}
.btn.primary:active{transform:translateY(1px)}
.btn.ghost{background:var(--paper);color:var(--navy);border:1.5px solid var(--line)}
.btn.dark{background:var(--navy);color:#fff}
.btn.ok{background:var(--ok);color:#fff}
.btn.sm{padding:9px 13px;min-height:40px;font-size:13.5px;border-radius:10px}
.btn.block{width:100%}

/* MISSION */
.mhead{border-radius:var(--r);padding:20px;color:#fff;background:var(--mc,var(--navy));position:relative;overflow:hidden}
.mhead:after{content:attr(data-n);position:absolute;right:10px;bottom:-34px;font:800 150px/1 var(--f-display);opacity:.13}
.mhead .eyebrow{color:rgba(255,255,255,.85)}
.mhead h1{color:#fff;font-size:clamp(24px,6vw,32px);font-weight:800;margin:8px 0 6px;max-width:15ch}
.mhead p{opacity:.92;max-width:44ch;font-size:15px;position:relative;z-index:1}
.mhead .meta-row .pill{background:rgba(255,255,255,.18);color:#fff}
.timer{border:0;cursor:pointer}
.timer.run{background:#fff !important;color:var(--navy) !important}

.block{margin-top:16px;background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:18px}
.blabel{display:flex;align-items:center;gap:8px;margin-bottom:12px}
.blabel b{font:800 11px/1 var(--f-display);letter-spacing:.14em;text-transform:uppercase;padding:6px 9px;border-radius:6px}
.blabel.saber b{background:#E7ECF5;color:var(--navy)}
.blabel.fazer b{background:var(--violet-soft);color:var(--violet)}
.blabel.check b{background:var(--ok-soft);color:var(--ok)}
.blabel span{font-size:13px;color:var(--muted)}
.block h2{font-size:19px;margin-bottom:8px}
.block h3{font-size:16px;margin-bottom:6px}
.lead{color:var(--muted);font-size:15px}
.lead + .lead{margin-top:8px}

.substep{display:grid;grid-template-columns:30px 1fr;gap:12px;padding-top:16px;margin-top:16px;border-top:1px dashed var(--line)}
.substep:first-of-type{border-top:0;margin-top:4px;padding-top:4px}
.sn{width:30px;height:30px;border-radius:50%;background:var(--violet);color:#fff;font:800 14px var(--f-display);display:grid;place-items:center}
.substep > div{min-width:0}
.substep h3{font-size:16px;margin:3px 0 4px}
.hint{font-size:13.5px;color:var(--muted);margin-bottom:10px}

.signals{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.sig{border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:#FBFBFE}
.sig b{display:block;font:700 13.5px/1.25 var(--f-display);color:var(--navy)}
.sig span{display:block;font-size:12.5px;color:var(--muted);line-height:1.35;margin-top:3px}
@media (max-width:420px){.signals{grid-template-columns:1fr}}
.notfor{margin-top:12px;border-radius:12px;padding:12px 14px;background:var(--warn-soft);color:#6A3A05;font-size:13.5px}
.notfor b{font-family:var(--f-display)}

/* chips */
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{appearance:none;border:1.5px solid var(--line);background:var(--paper);border-radius:999px;padding:9px 13px;font:600 13.5px/1.25 var(--f-body);cursor:pointer;text-align:left;color:var(--ink)}
.chip:hover{border-color:var(--violet-line)}
.chip.on{background:var(--violet);border-color:var(--violet);color:#fff}
.chip.sug{border-style:dashed;font-weight:500}
.chip.sug:before{content:"+ ";color:var(--violet);font-weight:700}
.chip.sug.on:before{color:#fff}

/* pain cards */
.pains{display:grid;gap:8px}
.pain{appearance:none;display:flex;gap:10px;align-items:flex-start;text-align:left;border:1.5px solid var(--line);background:var(--paper);border-radius:12px;padding:12px;cursor:pointer;width:100%}
.pain .box{flex:0 0 22px;height:22px;border-radius:6px;border:2px solid #C5CBDA;display:grid;place-items:center;color:#fff;font-size:14px;margin-top:1px}
.pain.on{border-color:var(--violet);background:var(--violet-soft)}
.pain.on .box{background:var(--violet);border-color:var(--violet)}
.pain small{display:block;color:var(--muted);font-size:12px;margin-top:2px}
.pgroup{font:700 11px var(--f-display);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:14px 0 8px}

/* thermometer */
.thermo{display:grid;gap:10px}
.trow{border:1px solid var(--line);border-radius:12px;padding:12px}
.trow h4{font-size:14.5px;margin-bottom:8px;font-family:var(--f-body);font-weight:600;color:var(--ink)}
.scale{display:grid;grid-template-columns:92px 1fr;gap:8px;align-items:center;margin-top:6px}
.scale > span{font:600 12px var(--f-display);color:var(--muted)}
.seg{display:grid;grid-template-columns:repeat(3,1fr);border:1.5px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{appearance:none;border:0;background:var(--paper);padding:8px 4px;font:600 12.5px var(--f-body);cursor:pointer;border-left:1px solid var(--line)}
.seg button:first-child{border-left:0}
.seg button.on{background:var(--navy);color:#fff}
.rank{margin-top:14px;display:grid;gap:8px}
.ritem{display:grid;grid-template-columns:28px 1fr auto;gap:10px;align-items:center;padding:10px 12px;border-radius:12px;border:1.5px solid var(--line);background:var(--paper);cursor:pointer;text-align:left;width:100%}
.ritem.best{border-color:var(--ok);background:var(--ok-soft)}
.ritem .rk{font:800 14px var(--f-display);color:var(--muted)}
.ritem.best .rk{color:var(--ok)}
.ritem .meter{height:6px;border-radius:3px;background:#E8EBF2;margin-top:6px;overflow:hidden}
.ritem .meter i{display:block;height:100%;background:var(--navy)}
.ritem.best .meter i{background:var(--ok)}
.ritem .sc{font:800 16px var(--f-display);color:var(--navy);font-variant-numeric:tabular-nums}
.ritem > div{min-width:0}
.ritem .t{font-size:14px;font-weight:600}

/* inputs */
.field{display:block;width:100%;border:1.5px solid var(--line);border-radius:12px;padding:12px 13px;background:#FCFCFE;font-size:15px;line-height:1.45;resize:vertical}
.field:focus{border-color:var(--violet-2);outline:none;box-shadow:0 0 0 3px var(--violet-soft)}
textarea.field{min-height:80px}
label.lbl{display:block;font:700 13px var(--f-display);color:var(--navy);margin:14px 0 6px}

/* sentence builder */
.sentence{font-size:17px;line-height:1.9;color:var(--ink);background:#FBFBFE;border:1px solid var(--line);border-radius:12px;padding:14px}
.blank{display:inline;border-bottom:2px solid var(--violet);color:var(--violet);font-weight:600;padding:0 2px}
.blank.empty{color:#9AA2B5;border-bottom-style:dashed;font-weight:500}
.sb-part{margin-top:14px}
.sb-part .q{font:700 13.5px var(--f-display);color:var(--navy);margin-bottom:6px}
.sb-part .field{margin-top:8px}

/* PROMPT letters */
.letters{display:grid;gap:10px}
.letter{border:1.5px solid var(--line);border-radius:14px;overflow:hidden;background:var(--paper)}
.letter > summary{display:flex;gap:12px;align-items:center;padding:12px 14px;background:#FAFAFD;cursor:pointer;list-style:none}
.letter > summary::-webkit-details-marker{display:none}
.letter[open] > summary{border-bottom:1px solid var(--line)}
.letter > summary .txt{min-width:0;flex:1}
.letter > summary em{font-style:normal;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;font-size:13px;color:var(--ink);margin-top:3px;line-height:1.35}
.letter > summary .edit{font:700 12px var(--f-display);color:var(--violet);white-space:nowrap}
.letter[open] > summary .edit:after{content:" ▲"}
.letter:not([open]) > summary .edit:after{content:" ▼"}
.letter .lt{width:38px;height:38px;flex:0 0 38px;border-radius:10px;color:#fff;display:grid;place-items:center;font:800 18px/1 var(--f-display);background:var(--lc)}
.letter summary b{font:800 15px var(--f-display);color:var(--navy);display:block}
.letter header span{font-size:12.5px;color:var(--muted);display:block;line-height:1.3}
.letter .in{padding:12px 14px;display:grid;gap:10px}
.prefix{font:600 12px var(--f-mono);color:var(--muted)}

/* prompt card */
.pcard{margin-top:12px;border-radius:14px;background:#141B2D;color:#E8ECF7;overflow:hidden}
.pcard header{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 14px;background:#0E1424;font:700 11px var(--f-display);letter-spacing:.12em;text-transform:uppercase;color:#AEB7D0}
.pcard header i{font-style:normal;color:var(--violet-2)}
.pcard pre{margin:0;padding:14px;font:400 13.5px/1.6 var(--f-mono);white-space:pre-wrap;word-break:break-word;max-height:330px;overflow:auto}
.pcard pre .ph{color:#FFC86B}
.pcard .acts{display:flex;gap:8px;padding:10px 14px 14px;flex-wrap:wrap}
.pcard .acts .btn{flex:1 1 140px}
.pcard .btn.copy{background:var(--violet-2);color:#fff}
.pcard .btn.open{background:#fff;color:var(--navy)}
.pcard .same{flex:1 1 160px;font-size:12.5px;line-height:1.35;color:#C9D1E8;align-self:center}
.pcard .same b{color:#fff}
.pcard.compact pre{max-height:180px}

.callout{margin-top:12px;border-radius:12px;padding:12px 14px;background:var(--violet-soft);color:#2D1470;font-size:14px}
.callout b{font-family:var(--f-display)}
.callout.ok{background:var(--ok-soft);color:#0A4D36}
.callout.warn{background:var(--warn-soft);color:#6A3A05}

/* refine cards */
.refine{display:grid;gap:10px}
.rf{border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.rf .rh{display:flex;align-items:center;justify-content:space-between;gap:10px}
.rf b{font:800 14.5px var(--f-display);color:var(--navy)}
.rf p{font:400 13px/1.5 var(--f-mono);color:var(--ink);margin-top:6px;background:#F6F7FB;border-radius:8px;padding:8px 10px}
.rf.used{border-color:var(--ok)}
.rf.used b:after{content:" ✓";color:var(--ok)}

/* tabs (formatos) */
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{appearance:none;flex:0 0 auto;border:1.5px solid var(--line);background:var(--paper);border-radius:10px;padding:9px 12px;font:700 13px var(--f-display);color:var(--navy);cursor:pointer}
.tab.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.fmt{margin-top:12px}
.fmt .uses{font-size:13.5px;color:var(--muted)}
.how2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.how2 div{border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-size:13.5px;line-height:1.45}
.how2 b{display:block;font:800 12px var(--f-display);letter-spacing:.06em;text-transform:uppercase;margin-bottom:4px}
.how2 .cp b{color:#0F6CBD}
.how2 .gm b{color:#1A73E8}
.how2 .pb{grid-column:1/-1;background:#FAFAFD}
.how2 .pb b{color:var(--muted)}
@media (max-width:460px){.how2{grid-template-columns:1fr}}

/* checklist */
.checks{display:grid;gap:8px}
.ck{appearance:none;display:flex;gap:10px;align-items:center;text-align:left;border:1px solid var(--line);background:var(--paper);border-radius:10px;padding:10px 12px;cursor:pointer;font-size:14.5px;width:100%}
.ck .box{flex:0 0 22px;height:22px;border-radius:50%;border:2px solid #C5CBDA;display:grid;place-items:center;color:#fff;font-size:13px}
.ck.on .box{background:var(--ok);border-color:var(--ok)}
.ck.on{background:var(--ok-soft);border-color:#BFE5D5}

/* checkpoint */
.cpt{border:2px solid var(--ok);background:var(--paper)}
.cpt .val{background:var(--ok-soft);border-radius:10px;padding:12px 14px;font-size:15px;margin-top:6px;color:#0A3D2B}
.cpt .val.empty{background:#F4F5FA;color:var(--muted);font-style:italic}
.nav{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap}
.nav .btn{flex:1 1 160px}

/* canvas */
.canvas{border-radius:16px;overflow:hidden;border:1px solid var(--line);background:var(--paper)}
.canvas .ch{background:var(--navy);color:#fff;padding:18px}
.canvas .ch small{font:700 11px var(--f-display);letter-spacing:.14em;text-transform:uppercase;color:var(--violet-2)}
.canvas .ch h2{color:#fff;font-size:22px;margin-top:6px}
.canvas .ch p{opacity:.8;font-size:13px;margin-top:4px}
.cgrid{display:grid;grid-template-columns:1fr 1fr}
.cc{padding:14px 16px;border-top:1px solid var(--line);border-left:1px solid var(--line);min-width:0}
.cc:nth-child(odd){border-left:0}
.cc.full{grid-column:1/-1;border-left:0}
.cc b{display:block;font:800 10.5px var(--f-display);letter-spacing:.12em;text-transform:uppercase;color:var(--violet);margin-bottom:4px}
.cc span{font-size:14.5px;display:block;word-break:break-word}
.cc span.empty{color:#9AA2B5;font-style:italic}


/* library */
.lib{display:grid;gap:10px}
details.li{border:1px solid var(--line);border-radius:12px;background:var(--paper);overflow:hidden}
details.li summary{cursor:pointer;list-style:none;padding:14px;display:flex;gap:12px;align-items:center}
details.li summary::-webkit-details-marker{display:none}
details.li summary .ic{width:34px;height:34px;flex:0 0 34px;border-radius:9px;background:var(--violet-soft);color:var(--violet);display:grid;place-items:center;font:800 14px var(--f-display)}
details.li summary b{font:700 15px var(--f-display);color:var(--navy);display:block}
details.li summary span{font-size:13px;color:var(--muted);display:block}
details.li summary:after{content:"+";margin-left:auto;font:700 20px var(--f-display);color:var(--muted)}
details.li[open] summary:after{content:"–"}
details.li .pcard{margin:0 12px 12px}

.foot{margin-top:28px;text-align:center;color:var(--muted);font-size:12.5px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(30px);background:var(--navy);color:#fff;padding:12px 18px;border-radius:12px;font:600 14px var(--f-display);opacity:0;transition:.25s;pointer-events:none;z-index:50;max-width:calc(100% - 32px);text-align:center}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.sel-tools{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.tool{appearance:none;border:1.5px solid var(--line);background:var(--paper);border-radius:12px;padding:12px;text-align:left;cursor:pointer}
.tool b{display:block;font:800 14px var(--f-display);color:var(--navy)}
.tool span{font-size:12px;color:var(--muted)}
.tool.on{border-color:var(--violet);background:var(--violet-soft)}
.rules{display:grid;gap:8px;margin-top:4px}

/* ============ HELPERS ============ */
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c];});}
function lc(s){s=String(s||"").trim();return s?s.charAt(0).toLowerCase()+s.slice(1):s;}
function toggle(arr,v,max){var i=arr.indexOf(v);if(i>-1)arr.splice(i,1);else{if(max&&arr.length>=max){toast("Máximo de "+max+". Desmarque uma para trocar.");return false;}arr.push(v);}return true;}
function tool(){return TOOLS[S.tool]||TOOLS.m365;}
function areaTxt(){return S.area&&S.area!=="Outra"?S.area:"";}
var tt;function toast(m){var t=document.getElementById("toast");t.textContent=m;t.classList.add("show");clearTimeout(tt);tt=setTimeout(function(){t.classList.remove("show");},2200);}
function copy(text,msg){
  var done=function(){toast(msg||"Copiado! Agora cole na IA");};
  var fallback=function(){var ta=document.createElement("textarea");ta.value=text;ta.setAttribute("readonly","");ta.style.position="fixed";ta.style.opacity="0";document.body.appendChild(ta);ta.select();ta.setSelectionRange(0,ta.value.length);try{document.execCommand("copy");done();}catch(e){toast("Toque e segure no texto para copiar");}document.body.removeChild(ta);};
  try{if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(text).then(done,fallback);}else fallback();}catch(e){fallback();}
}
function maxPains(){return S.custom.trim()?2:3;}
function painList(){var l=S.pains.slice();var c=S.custom.trim();if(c&&l.indexOf(c)<0)l.push(c);return l;}
function sol(){return SOL.filter(function(x){return x.k===S.sol;})[0]||null;}
function problem(){return S.chosen||(painList().length===1?painList()[0]:"");}

    if(!b){toast("Toque e segure na imagem para salvar");return;}
    var file;try{file=new File([b],"projeto-ia.png",{type:"image/png"});}catch(e){}
    if(file&&navigator.canShare&&navigator.canShare({files:[file]})){navigator.share({files:[file],title:"Meu Projeto IA",text:cardText()}).catch(function(){});}
    else{try{var a=document.createElement("a");a.href=URL.createObjectURL(b);a.download="projeto-ia.png";document.body.appendChild(a);a.click();a.remove();toast("Imagem baixada");}catch(e){toast("Toque e segure na imagem para salvar");}}
  },"image/png");
}

/* ============ RENDER ============ */
var app=document.getElementById("app");var bbar=document.getElementById("bbar");var sheet=document.getElementById("sheet");
var cur="home";var MV=[M0,M1,M2,M3,M4,M5];var PIECES=[];
function route(){var h=(location.hash||"").replace("#","");if(/^m[0-5]$/.test(h))cur=+h.slice(1);else if(h==="kit")cur="kit";else cur="home";render();window.scrollTo(0,0);}
function go(x){location.hash=x==="home"?"inicio":(x==="kit"?"kit":"m"+x);}
function doneCount(){var n=0;for(var i=0;i<6;i++)if(S.done[i])n++;return n;}
function hereIdx(){for(var i=0;i<6;i++)if(!S.done[i])return i;return 5;}
function header(){
  document.getElementById("dots").innerHTML=MISSIONS.map(function(m){return '<button class="dot'+(S.done[m.n]?" done":"")+(cur===m.n?" cur":"")+'" data-go="'+m.n+'" aria-label="Missão '+m.n+'">'+m.n+'</button>';}).join("");
  document.getElementById("barFill").style.width=(doneCount()/6*100)+"%";
}
function vHome(){
  var here=hereIdx();var total=MISSIONS.reduce(function(a,m){return a+m.min;},0);
  var h='<section class="hero"><span class="eyebrow">Laboratório · '+total+' min · no celular</span><h1>Do problema real ao seu <em>projeto com IA</em></h1><p>Uma conversa com a IA, do começo ao fim. Este site te guia etapa por etapa: diz o que fazer e entrega o prompt certo. A IA faz o trabalho pesado com você. No final, você sai com uma ferramenta testada e um projeto pronto para começar amanhã.</p><div class="meta-row"><span class="pill navy">Gerentes, coordenadores e supervisores</span><span class="pill red">Método PROMPT</span></div></section>';
  h+='<div class="how"><div><b>1 conversa</b><span>Aberta na Missão 0 e usada até o fim.</span></div><div><b>Prompt pronto</b><span>Copie aqui, cole na IA, responda.</span></div><div><b>Travou?</b><span>Botão de ajuda em toda tela.</span></div></div>';
  h+='<div class="sec-title"><h2>Roteiro</h2><span>'+doneCount()+' de 6 concluídas</span></div><ol class="route">';
  MISSIONS.forEach(function(m){var st=S.done[m.n]?'<span class="state done">Feita ✓</span>':(m.n===here?'<span class="state here">Estamos aqui</span>':'<span class="state">&nbsp;</span>');
    h+='<li><button class="step" data-go="'+m.n+'"><span class="num" style="--mc:'+m.c+'">'+m.n+'</span><span style="min-width:0"><h3>'+esc(m.t)+'</h3><p>'+esc(m.d)+'</p><span class="tags">'+m.tags.map(function(t){return '<span class="tag">'+esc(t)+'</span>';}).join("")+'</span></span><span><span class="min">'+m.min+'′</span>'+st+'</span></button></li>';});
  h+='</ol><div class="cta"><button class="btn primary block" data-go="'+here+'">'+(doneCount()?'Continuar na Missão '+here:'Começar pela Missão 0')+' →</button><button class="btn ghost block" data-go="kit">Biblioteca de prompts para levar</button></div>';
  h+='<p class="foot">Seu progresso fica salvo neste aparelho. · <button class="chip" data-reset="1" style="padding:5px 10px;font-size:12px">Recomeçar do zero</button></p>';
  return h;
}
function vKit(){
  var h='<section class="hero"><span class="eyebrow">Para levar</span><h1>Biblioteca de <em>prompts</em> da liderança</h1><p>Oito prompts prontos para a rotina de quem lidera. Troque o que está entre colchetes e use amanhã.</p></section><div class="lib" style="margin-top:14px">';
  LIB.forEach(function(l){h+='<details class="li"><summary><span class="ic">'+l.i+'</span><span><b>'+esc(l.t)+'</b><span>'+esc(l.d)+'</span></span></summary>'+pcard(l.t,l.p,{lib:true})+'</details>';});
  return h+'</div><div class="cta"><button class="btn ghost block" data-go="home">← Voltar ao roteiro</button></div>';
}
function vMission(n){
  var m=MISSIONS[n];PIECES=MV[n]();var si=Math.min(S.sub[n]||0,PIECES.length-1);S.sub[n]=si;S.seen[n]=Math.max(S.seen[n]||0,si);
  var h='<section class="mhead" style="--mc:'+m.c+'" data-n="'+m.n+'"><span class="eyebrow">Missão '+m.n+' de 5 · '+m.min+' min</span><h1>'+esc(m.t)+'</h1><p>'+esc(m.d)+'</p><div class="meta-row"><button class="pill timer" data-timer="'+m.min+'">⏱ '+m.min+':00 · iniciar</button></div></section>';
  h+='<div class="steps">'+PIECES.map(function(p,i){return '<button class="sp'+(i===si?" cur":(i<=S.seen[n]?" seen":""))+'" data-sub="'+i+'">'+(p.l==="Saber"?"Saber":(p.l==="✓"?"✓ Check":"Passo "+p.l))+'</button>';}).join("")+'</div>';
  return h+'<div class="piece">'+PIECES[si].h+'</div>';
}
function renderBar(){
  if(typeof cur!=="number"){bbar.hidden=true;return;}
  bbar.hidden=false;var n=cur,si=S.sub[n]||0,last=si===PIECES.length-1;var p=PIECES[si];
  var next=last?(n<5?"Concluir · Missão "+(n+1)+" →":"Concluir laboratório ✓"):(PIECES[si+1].l==="✓"?"Checkpoint →":"Passo "+PIECES[si+1].l+" →");
  bbar.innerHTML='<div class="in"><button class="btn ghost back" data-nav="-1" aria-label="Voltar">←</button><button class="btn help" data-help="1">Travou?</button><button class="btn primary next'+(last&&p.can===false?" wait":"")+'" data-nav="1">'+next+'</button></div>';
}
function render(){
  PC={};app.innerHTML=cur==="home"?vHome():cur==="kit"?vKit():vMission(cur);
  header();renderBar();save();
  if(cur===5&&(S.sub[5]||0)===PIECES.length-1)refreshCard();
}
function softRender(){var y=window.scrollY;var a=document.activeElement&&document.activeElement.id;render();window.scrollTo(0,y);if(a){var el=document.getElementById(a);if(el&&(el.tagName==="INPUT"||el.tagName==="TEXTAREA")){el.focus({preventScroll:true});try{var l=el.value.length;el.setSelectionRange(l,l);}catch(e){}}}}
function live(){
  var q=function(s){return app.querySelector('[data-live="'+s+'"]');};var el;
  if((el=q("main")))el.innerHTML=pcard("Seu PROMPT",P_main(),{mark:"ran1"});
  app.querySelectorAll("[data-lv]").forEach(function(x){x.textContent=letterVal(x.dataset.lv);});
  save();
}
function openHelp(){
  var n=typeof cur==="number"?cur:0;
  sheet.innerHTML='<div class="card" role="dialog" aria-label="Ajuda"><h3>Travou na Missão '+n+'?</h3><ul>'+(HELP[n]||[]).map(function(t){return '<li><b>'+esc(t[0])+'</b><br>'+esc(t[1])+'</li>';}).join("")+'<li><b>Ainda travado?</b><br>Levante a mão: o facilitador vem até você. Ou faça em dupla com quem está do lado.</li></ul><button class="btn dark block" data-closehelp="1" style="margin-top:14px">Fechar</button></div>';
  sheet.hidden=false;
}

/* ============ EVENTOS ============ */
var timerInt=null,timerEnd=0;
document.addEventListener("toggle",function(e){var t=e.target;if(t.classList&&t.classList.contains("letter"))OPENL[t.dataset.l]=t.open;},true);
sheet.addEventListener("click",function(e){if(e.target===sheet)sheet.hidden=true;});
document.addEventListener("click",function(e){
  var b=e.target.closest("button,a");if(!b)return;var d=b.dataset;
  if(b.id==="goHome"){go("home");return;}
  if(d.go!==undefined){go(d.go==="home"||d.go==="kit"?d.go:+d.go);return;}
  if(d.help){openHelp();return;}
  if(d.closehelp){sheet.hidden=true;return;}
  if(d.nav){var n=cur,si=S.sub[n]||0;
    if(+d.nav<0){if(si>0){S.sub[n]=si-1;render();window.scrollTo(0,0);}else if(n>0)go(n-1);else go("home");return;}
    if(si<PIECES.length-1){S.sub[n]=si+1;render();window.scrollTo(0,0);return;}
    var p=PIECES[si];if(p.can===false){toast(p.why||"Complete o checkpoint");return;}
    S.done[n]=true;save();if(n<5)go(n+1);else{toast("Laboratório concluído! Agora é testar no real");go("home");}return;}
  if(d.sub!==undefined){S.sub[cur]=+d.sub;render();window.scrollTo(0,0);return;}
  if(d.copy){var txt=PC[d.copy];if(txt)copy(txt,d.msg);if(d.mark&&!S[d.mark]){S[d.mark]=true;save();softRender();}return;}
  if(d.sharecard){shareCard();return;}
  if(d.area){S.area=d.area;S.pr.papel="";softRender();return;}
  if(d.cargo){S.cargo=d.cargo;softRender();return;}
  if(d.tool){S.tool=d.tool;softRender();return;}
  if(d.flag){S[d.flag]=!S[d.flag];softRender();return;}
  if(d.pain){if(S.pains.indexOf(d.pain)<0&&S.pains.length>=maxPains()){toast(S.custom.trim()?"Máximo de 3 contando a que você escreveu. Desmarque uma para trocar.":"Máximo de 3. Desmarque uma para trocar.");return;}if(toggle(S.pains,d.pain)){if(S.chosen&&painList().indexOf(S.chosen)<0)S.chosen="";}softRender();return;}
  if(d.chosen){S.chosen=d.chosen;softRender();return;}
  if(d.sol){S.sol=d.sol;S.pr.req="";S.pr.mod=[];softRender();return;}
  if(d.obj!==undefined){S.pr.obj=d.obj;softRender();return;}
  if(d.mod!==undefined){toggle(S.pr.mod,d.mod,3);softRender();return;}
  if(d.panx!==undefined){toggle(S.pr.panx,d.panx);softRender();return;}
  if(d.tst!==undefined){toggle(S.pr.tst,d.tst);softRender();return;}
  if(d.build){S.build=d.build;softRender();return;}
  if(d.testres!==undefined){S.testRes=d.testres;softRender();return;}
  if(d.ganho!==undefined){S.proj.ganho=d.ganho;softRender();return;}
  if(d.quando!==undefined){S.proj.quando=d.quando;softRender();return;}
  if(d.quem!==undefined){S.proj.quem=d.quem;softRender();return;}
  if(d.feita!==undefined){S.proj.feita=d.feita;softRender();return;}
  if(d.timer){var mins=+d.timer;
    if(timerInt){clearInterval(timerInt);timerInt=null;b.classList.remove("run");b.textContent="⏱ "+mins+":00 · iniciar";return;}
    timerEnd=Date.now()+mins*60000;
    var tick=function(){var left=Math.max(0,timerEnd-Date.now());var mm=Math.floor(left/60000),ss=Math.floor(left%60000/1000);var tb=app.querySelector("[data-timer]");if(tb){tb.classList.toggle("run",!!left);tb.textContent="⏱ "+mm+":"+(ss<10?"0":"")+ss+(left?" · tocar para parar":" · tempo!");}if(!left){clearInterval(timerInt);timerInt=null;try{navigator.vibrate&&navigator.vibrate([200,100,200]);}catch(x){}toast("Tempo da missão encerrado");}};
    tick();timerInt=setInterval(tick,1000);return;}
  if(d.reset){if(b.dataset.armed){S=blank();try{localStorage.removeItem(KEY);}catch(x){}go("home");render();toast("Tudo limpo");}else{b.dataset.armed="1";b.textContent="Toque de novo para confirmar";}return;}
});
document.addEventListener("input",function(e){
  var t=e.target;var bind=t.dataset&&t.dataset.bind;if(!bind)return;
  var path=bind.split(".");var o=S;for(var i=0;i<path.length-1;i++)o=o[path[i]];o[path[path.length-1]]=t.value;
  if(bind==="custom"){if(S.custom.trim()&&S.pains.length>2){S.pains=S.pains.slice(0,2);toast("A dor escrita conta como uma das 3. Mantive as 2 primeiras marcadas.");}if(S.chosen&&painList().indexOf(S.chosen)<0)S.chosen="";save();clearTimeout(window.__ct);window.__ct=setTimeout(softRender,800);return;}
  live();
});
window.addEventListener("hashchange",route);
route();
})();
</script>
