<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Aula ao vivo — Alta Performance Comercial</title>
<script src="apc-config.js"></script>
<script src="supabase.min.js"></script>
<script src="apc-auth.js"></script>

<meta name="description" content="Acompanhe a aula momento a momento: conceitos, perguntas, atividades e ferramentas de cada módulo.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{--navy:#0E2A5C;--blue:#1565C0;--turq:#12A3A8;--green:#1DBF8A;--ice:#EAF4FB;--mint:#E8F8F3;--grey:#5A6B85;--line:#D6E1EC;--soft:#F6F9FC;--warn:#FFF6E5;--red:#D64545;--grad:linear-gradient(90deg,#0E2A5C 0%,#12A3A8 60%,#1DBF8A 100%);--r:16px;--sh:0 6px 24px rgba(14,42,92,.08);--f:Montserrat,system-ui,-apple-system,"Segoe UI",sans-serif}
*{box-sizing:border-box}html{scroll-behavior:smooth}
body{margin:0;font-family:var(--f);color:var(--navy);background:#fff;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,textarea,select{font-family:var(--f)}
a{color:var(--blue)}
.topline{height:4px;background:linear-gradient(90deg,var(--blue) 0 66%,#C9D3DE 66% 100%)}
header.site{position:sticky;top:0;z-index:60;background:rgba(255,255,255,.97);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.bar{display:flex;align-items:center;gap:14px;padding:10px 20px;max-width:1400px;margin:0 auto}
.brand{display:flex;flex-direction:column;line-height:1.1;text-decoration:none;color:var(--navy);flex:none}
.brand b{font-size:12px;letter-spacing:.06em;font-weight:800}.brand span{font-size:11px;color:var(--grey);font-weight:600}
.mods{display:flex;gap:4px;background:var(--soft);border:1px solid var(--line);border-radius:999px;padding:4px;margin:0 auto}
.mods button{border:0;background:transparent;color:var(--navy);font-weight:800;font-size:13px;padding:8px 14px;border-radius:999px;cursor:pointer;white-space:nowrap}
.mods button.on{background:var(--navy);color:#fff}
.tools{display:flex;gap:6px;flex:none}
.ib{border:1.5px solid var(--line);background:#fff;color:var(--navy);font-weight:700;font-size:12.5px;padding:8px 12px;border-radius:10px;cursor:pointer;white-space:nowrap}
.ib:hover{border-color:var(--turq)}.ib.dark{background:var(--navy);color:#fff;border-color:var(--navy)}
.only-m{display:none}
@media(max-width:980px){.bar{flex-wrap:wrap;padding:10px 16px}.mods{order:3;width:100%;justify-content:space-between;margin:0}.mods button{flex:1;padding:8px 6px;font-size:12px}.tools{margin-left:auto}.only-m{display:inline-block}.hide-m{display:none}}
.app{display:grid;grid-template-columns:330px 1fr;max-width:1400px;margin:0 auto;min-height:calc(100vh - 70px)}
aside.rot{border-right:1px solid var(--line);background:var(--soft);position:sticky;top:62px;height:calc(100vh - 62px);overflow:auto;padding:18px 14px 40px}
@media(max-width:980px){.app{grid-template-columns:1fr}aside.rot{position:fixed;inset:0 auto 0 0;width:min(88vw,360px);height:100%;top:0;z-index:80;transform:translateX(-102%);transition:.25s;box-shadow:var(--sh);padding-top:20px}aside.rot.open{transform:none}}
.scrim{display:none;position:fixed;inset:0;background:rgba(14,42,92,.35);z-index:70}.scrim.on{display:block}
.rhead{padding:4px 6px 14px}
.rhead small{font-size:11px;font-weight:800;letter-spacing:.08em;color:var(--turq);text-transform:uppercase}
.rhead h3{margin:4px 0 8px;font-size:18px;line-height:1.2}
.prog{height:8px;background:#DCE6F0;border-radius:8px;overflow:hidden}.prog i{display:block;height:100%;background:var(--grad);width:0;transition:.3s}
.rhead .pl{display:flex;justify-content:space-between;font-size:11.5px;color:var(--grey);font-weight:700;margin-top:6px}
.grp{font-size:10.5px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--grey);margin:16px 8px 6px}
.it{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;border:0;background:transparent;padding:9px 8px;border-radius:12px;cursor:pointer;color:var(--navy)}
.it:hover{background:#fff}.it.on{background:#fff;box-shadow:0 0 0 2px var(--turq) inset}
.it .n{flex:none;width:26px;height:26px;border-radius:8px;display:grid;place-items:center;font-size:12px;font-weight:800;background:#fff;border:1.5px solid var(--line)}
.it.done .n{background:var(--green);border-color:var(--green);color:#fff}
.it .tx{flex:1;font-size:13px;font-weight:700;line-height:1.3}
.it .tx em{display:block;font-style:normal;font-size:11px;font-weight:600;color:var(--grey);margin-top:2px}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px;vertical-align:1px}
.k-conceito{background:var(--blue)}.k-pratica{background:var(--turq)}.k-discussao{background:#8E6BD8}.k-pausa{background:#B8C4D2}.k-ia{background:var(--green)}.k-canvas{background:#F2A93B}
main{padding:34px 44px 120px;min-width:0;position:relative}
@media(max-width:980px){main{padding:22px 16px 110px}}
.chev{position:absolute;right:40px;top:26px;color:#D4DCE6;font-weight:900;font-size:54px;letter-spacing:-8px;pointer-events:none;user-select:none}
.meta{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:10px}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--grad);color:#fff;font-weight:800;font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;padding:6px 12px;border-radius:999px}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;padding:5px 10px;border-radius:999px;background:var(--ice);color:var(--navy)}
.pill.fic{background:var(--warn);color:#8A5A00}
h1,h2,h3{line-height:1.12;margin:.2em 0}
h1{font-size:clamp(32px,5vw,56px);font-weight:900;letter-spacing:-.02em}
h2{font-size:clamp(26px,3.6vw,42px);font-weight:800;letter-spacing:-.01em;max-width:900px}
.hl{background:linear-gradient(transparent 8%,#3ED3D8 8%,#3ED3D8 94%,transparent 94%);border-radius:10px;padding:0 .14em;-webkit-box-decoration-break:clone;box-decoration-break:clone}
.under{display:block;width:70px;height:6px;border-radius:6px;background:var(--turq);margin:12px 0 18px}
.lead{font-size:18.5px;color:#33476B;max-width:820px;margin:0 0 22px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px;margin:6px 0 24px}
.cd{background:#fff;border:1px solid var(--line);border-radius:14px;overflow:hidden;box-shadow:var(--sh)}
.cd b{display:block;background:var(--grad);color:#fff;padding:10px 14px;font-size:14px;font-weight:800}
.cd span{display:block;padding:11px 14px 13px;font-size:14px;color:#33476B}
.dlg{display:flex;flex-direction:column;gap:8px;margin:4px 0 24px;max-width:780px}
.bub{max-width:88%;padding:11px 14px;border-radius:16px;font-size:15px;background:var(--ice)}
.bub small{display:block;font-size:10.5px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--turq);margin-bottom:2px}
.bub.v{align-self:flex-end;background:var(--navy);color:#fff}.bub.v small{color:#7FE3E6}
.bub.sec{align-self:stretch;max-width:100%;background:transparent;border-left:4px solid var(--turq);border-radius:0;padding:4px 12px;font-weight:700}
.ask{display:flex;gap:14px;align-items:flex-start;background:var(--mint);border-radius:16px;padding:16px 18px;margin:0 0 24px;max-width:860px}
.ask .q{flex:none;width:38px;height:38px;border-radius:12px;background:var(--green);color:#fff;display:grid;place-items:center;font-weight:900;font-size:20px}
.ask small{display:block;font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:#0D8A62}
.ask p{margin:2px 0 0;font-size:17px;font-weight:700}
.w{border:1px solid var(--line);border-radius:18px;padding:18px;margin:0 0 20px;background:#fff;box-shadow:var(--sh)}
.w h4{margin:0 0 12px;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--turq);display:flex;align-items:center;gap:8px}
.w h4:before{content:"";width:18px;height:4px;border-radius:4px;background:var(--turq)}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.op{border:1.5px solid var(--line);background:#fff;color:var(--navy);font-weight:700;font-size:14px;padding:10px 14px;border-radius:12px;cursor:pointer;text-align:left}
.op:hover{border-color:var(--turq)}.op.on{background:var(--navy);border-color:var(--navy);color:#fff}
.op.ok{background:var(--green);border-color:var(--green);color:#fff}.op.no{background:#FDECEC;border-color:var(--red);color:var(--red)}
.qrow{padding:12px 0;border-top:1px dashed var(--line)}.qrow:first-of-type{border-top:0;padding-top:0}
.qrow p{margin:0 0 8px;font-weight:700}
.qscore{margin-top:10px;font-weight:800;color:var(--turq);font-size:14px}
label.f{display:block;font-weight:800;font-size:13.5px;margin:10px 0 6px}
textarea,input[type=text],input[type=number]{width:100%;font-size:15px;color:var(--navy);border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;background:#fff;resize:vertical}
textarea:focus,input:focus{outline:none;border-color:var(--turq);box-shadow:0 0 0 3px rgba(18,163,168,.15)}
.out{background:var(--navy);color:#EAF4FB;border-radius:14px;padding:14px 16px;margin-top:14px}
.out .t{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.out .t b{font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:#7FE3E6}
.out pre{white-space:pre-wrap;font:500 14px/1.55 var(--f);margin:8px 0 0}
.btn{display:inline-flex;align-items:center;gap:6px;border:0;cursor:pointer;font-weight:800;font-size:13px;padding:9px 13px;border-radius:10px;text-decoration:none}
.btn.ok{background:var(--green);color:#fff}.btn.sec{background:var(--ice);color:var(--navy)}.btn.pri{background:var(--navy);color:#fff}.btn.ghost{background:transparent;color:#7FE3E6;border:1.5px solid #3B5A8C}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.note{font-size:13.5px;color:#6B5200;background:var(--warn);border-radius:12px;padding:11px 14px;margin:0 0 22px;max-width:860px}
.note b{color:#8A5A00}
.rv{margin-top:12px;background:var(--ice);border-radius:12px;padding:12px 14px;font-size:14.5px;white-space:pre-wrap}
table.rb{width:100%;border-collapse:collapse;font-size:14px}
table.rb th{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--grey);text-align:left;padding:6px}
table.rb td{padding:8px 6px;border-top:1px solid var(--line);vertical-align:middle}
.sc{display:flex;gap:4px}.sc button{width:32px;height:32px;border-radius:9px;border:1.5px solid var(--line);background:#fff;font-weight:800;cursor:pointer;color:var(--navy)}
.sc button.on{background:var(--turq);border-color:var(--turq);color:#fff}
.tot{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}
.tot div{background:var(--ice);border-radius:12px;padding:8px 14px;text-align:center}
.tot b{display:block;font-size:22px;font-weight:900;color:var(--turq)}.tot span{font-size:11.5px;font-weight:700}
.fn{display:flex;flex-direction:column;gap:6px}
.fs{display:grid;grid-template-columns:minmax(120px,190px) 90px 1fr;gap:10px;align-items:center}
@media(max-width:640px){.fs{grid-template-columns:1fr 80px}.fs .fb{grid-column:1/-1}}
.fs label{font-weight:700;font-size:13.5px}
.fb{height:30px;background:var(--soft);border-radius:8px;position:relative;overflow:hidden}
.fb i{position:absolute;left:0;top:0;bottom:0;background:var(--grad);border-radius:8px}
.fb em{position:absolute;right:8px;top:5px;font-style:normal;font-size:12px;font-weight:800;color:var(--navy)}
.drop{margin-top:10px;font-weight:800;color:#8A5A00;background:var(--warn);border-radius:10px;padding:8px 12px;font-size:14px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}@media(max-width:760px){.grid2{grid-template-columns:1fr}}
.mini{background:var(--soft);border-radius:14px;padding:12px 14px}
.mini h5{margin:0 0 8px;font-size:14px}
.mini .r{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:6px 0;font-size:13.5px}
.mini .r input{max-width:110px;text-align:right;font-weight:800}
.mini .res{font-size:20px;font-weight:900;color:var(--turq);margin-top:6px}
.clk{display:flex;flex-direction:column;gap:6px}
.ck{display:grid;grid-template-columns:34px 1fr auto;gap:10px;align-items:center;padding:8px 10px;border-radius:12px;background:var(--soft)}
.ck.run{background:var(--mint);box-shadow:0 0 0 2px var(--green) inset}.ck.fin{opacity:.55}
.ck button{width:34px;height:34px;border-radius:10px;border:0;background:var(--navy);color:#fff;cursor:pointer;font-size:13px}
.ck b{font-size:14px}.ck span{font-weight:800;font-variant-numeric:tabular-nums}
.clkt{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;font-weight:800;font-size:13px;color:var(--grey)}
.wk{overflow-x:auto}.wk table{border-collapse:collapse;min-width:420px;width:100%}
.wk th,.wk td{padding:8px;text-align:center;border-top:1px solid var(--line);font-size:13.5px}.wk td:first-child,.wk th:first-child{text-align:left;font-weight:700}
.wk input{width:20px;height:20px;accent-color:var(--turq)}
.cvg{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}
.cvb{border:1px solid var(--line);border-radius:14px;overflow:hidden}
.cvb h5{margin:0;padding:9px 12px;background:var(--navy);color:#fff;font-size:12px;letter-spacing:.06em;text-transform:uppercase}
.cvb:nth-child(3n+2) h5{background:var(--blue)}.cvb:nth-child(3n) h5{background:var(--turq)}
.cvb p{margin:8px 12px 0;font-size:12.5px;color:var(--grey)}
.cvb textarea{border:0;border-radius:0;min-height:96px}
.saved{font-size:12px;font-weight:800;color:var(--green);margin-left:8px}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:14px}
table.ct{border-collapse:collapse;width:100%;min-width:760px;font-size:13px}
table.ct th{background:var(--navy);color:#fff;text-align:left;padding:8px;font-size:11px;letter-spacing:.04em;text-transform:uppercase}
table.ct td{padding:8px;border-top:1px solid var(--line);vertical-align:top}
table.ct tr.sel td{background:var(--mint)}
table.ct input[type=checkbox]{width:20px;height:20px;accent-color:var(--turq)}
.tabs{display:flex;gap:6px;margin:0 0 12px}.tabs button{border:0;background:var(--ice);color:var(--navy);font-weight:800;font-size:13px;padding:9px 13px;border-radius:10px;cursor:pointer}.tabs button.on{background:var(--grad);color:#fff}
.acts{display:grid;gap:10px;margin-top:12px}
.act{border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.act b{font-size:13.5px}
.act .grid3{display:grid;grid-template-columns:2fr 1fr 1fr;gap:8px;margin-top:6px}@media(max-width:640px){.act .grid3{grid-template-columns:1fr}}
.chk label{display:flex;gap:10px;align-items:center;background:var(--ice);border-radius:12px;padding:11px 12px;margin:6px 0;font-weight:700;cursor:pointer}
.chk input{width:20px;height:20px;accent-color:var(--turq)}
.lk{display:flex;flex-wrap:wrap;gap:10px}
.lk a{display:inline-flex;align-items:center;gap:6px;padding:11px 15px;border-radius:12px;background:var(--ice);text-decoration:none;font-weight:800;color:var(--navy)}
.lk a:after{content:"»";color:var(--turq)}
.navf{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:34px;padding-top:18px;border-top:1px solid var(--line);flex-wrap:wrap}
.donebtn{border:2px solid var(--green);background:#fff;color:#0D8A62;font-weight:800;font-size:14px;padding:11px 16px;border-radius:12px;cursor:pointer}
.donebtn.on{background:var(--green);color:#fff}
.mobnav{display:none}
@media(max-width:980px){.mobnav{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:50;background:#fff;border-top:1px solid var(--line);padding:10px 16px;gap:8px;align-items:center}.mobnav .c{flex:1;text-align:center;font-weight:800;font-size:13px}.navf{display:none}}
/* overview */
.ov .stats{display:flex;gap:12px;flex-wrap:wrap;margin:6px 0 22px}
.ov .stats div{background:var(--ice);border-radius:14px;padding:12px 18px}
.ov .stats b{display:block;font-size:26px;font-weight:900;color:var(--turq)}.ov .stats span{font-size:12px;font-weight:700}
.tl{display:flex;height:38px;border-radius:12px;overflow:hidden;margin:8px 0 6px;border:1px solid var(--line)}
.tl i{display:block;height:100%;border-right:2px solid #fff;cursor:pointer;position:relative}
.tl i:hover{filter:brightness(1.12)}
.leg{display:flex;flex-wrap:wrap;gap:12px;font-size:12px;font-weight:700;color:var(--grey);margin-bottom:24px}
.leva{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px;margin:0 0 26px}
.leva div{background:var(--mint);border-radius:12px;padding:12px 14px;font-weight:700}
.leva div:before{content:"✓ ";color:var(--green);font-weight:900}
/* glossário */
.gl{position:fixed;right:0;top:0;bottom:0;width:min(420px,92vw);background:#fff;z-index:90;box-shadow:-10px 0 30px rgba(14,42,92,.15);transform:translateX(105%);transition:.25s;overflow:auto;padding:22px}
.gl.open{transform:none}
.gl dl{margin:0}.gl dt{font-weight:900;margin-top:14px}.gl dd{margin:2px 0 0;color:#33476B;font-size:14px}
/* projetor */
.timer{display:none;align-items:center;gap:8px;background:var(--navy);color:#fff;border-radius:12px;padding:6px 8px 6px 14px}
.timer b{font-size:22px;font-weight:900;font-variant-numeric:tabular-nums;min-width:74px}
.timer b.over{color:#FF9B9B}
.timer button{border:0;background:#25467F;color:#fff;border-radius:8px;width:32px;height:32px;cursor:pointer;font-weight:800}
body.proj .timer{display:flex}
body.proj .app{grid-template-columns:1fr;max-width:none}
body.proj aside.rot{display:none}
body.proj main{padding:40px 6vw 80px}
body.proj h2{font-size:clamp(34px,4.6vw,64px);max-width:none}
body.proj .lead{font-size:clamp(20px,1.9vw,28px);max-width:1300px}
body.proj .cd span,body.proj .bub{font-size:clamp(15px,1.4vw,21px)}
body.proj .cd b{font-size:clamp(15px,1.4vw,21px)}
body.proj .ask p{font-size:clamp(18px,1.7vw,26px)}
body.proj .stepbig{display:block}
.stepbig{display:none;position:fixed;right:24px;bottom:20px;background:var(--grad);color:#fff;font-weight:900;font-size:18px;padding:10px 18px;border-radius:14px;z-index:40;box-shadow:var(--sh)}
.toast{position:fixed;left:50%;bottom:84px;transform:translateX(-50%) translateY(160px);background:var(--navy);color:#fff;font-weight:800;padding:12px 18px;border-radius:12px;box-shadow:var(--sh);transition:.25s;z-index:99}
.toast.show{transform:translateX(-50%) translateY(0)}
.empty{color:var(--grey);font-style:italic}
</style>
</head>
<body>
<div class="topline"></div>
<header class="site"><div class="bar">
  <button class="ib only-m" id="bRot">☰ Roteiro</button>
  <a class="brand hide-m" href="index.html"><b>AULA AO VIVO</b><span>Alta Performance Comercial</span></a>
  <nav class="mods" id="mods"></nav>
  <div class="timer" id="timer"><b id="tt">00:00</b><button id="tp" title="Iniciar ou pausar">▶</button><button id="tr" title="Reiniciar">↺</button></div>
  <div class="tools"><button class="ib" id="bGl">Glossário</button><button class="ib dark hide-m" id="bProj">Projetar</button><a class="ib hide-m" href="index.html" style="text-decoration:none">Kit »</a></div>
</div></header>
<div class="scrim" id="scrim"></div>
<div class="app">
  <aside class="rot" id="rot"></aside>
  <main id="main"></main>
</div>
<div class="mobnav"><button class="btn sec" id="mPrev">‹ Anterior</button><span class="c" id="mPos"></span><button class="btn pri" id="mNext">Próximo ›</button></div>
<div class="stepbig" id="stepbig"></div>
<aside class="gl" id="gl"><div style="display:flex;justify-content:space-between;align-items:center"><h3 style="margin:0">Glossário</h3><button class="ib" id="glx">Fechar</button></div><dl id="gld"></dl></aside>
<div class="toast" id="toast">Copiado!</div>
<script>
const MODS=[];
// MÓDULO 1 — Do instinto ao método (230 min, duas noites)

 const blocos=[];m.momentos.forEach((x,i)=>{const b=blocos[blocos.length-1];if(b&&b.n===x.bloco)b.t+=x.t;else blocos.push({n:x.bloco,t:x.t,i:i+1})});

function go(mid,i){mod=MODS.find(m=>m.id===mid)||MODS[0];idx=Math.max(0,Math.min(i,mod.momentos.length));ST.last=mod.id+'/'+idx;save();const h='#'+mod.id+'/'+idx;try{if(location.hash!==h)history.replaceState(null,'',h)}catch(e){};render()}
function next(){if(idx<mod.momentos.length){if(idx>0){ST.done[mod.id+'/'+idx]=true;save()}go(mod.id,idx+1)}else{ST.done[mod.id+'/'+idx]=true;save();const j=MODS.indexOf(mod);if(j<MODS.length-1)go(MODS[j+1].id,0);else render()}}
function prev(){if(idx>0)go(mod.id,idx-1);else{const j=MODS.indexOf(mod);if(j>0)go(MODS[j-1].id,MODS[j-1].momentos.length)}}
/* timer do projetor */
let tLeft=0,tInt=null;
function resetTimer(){clearInterval(tInt);tInt=null;const x=idx?mod.momentos[idx-1]:null;tLeft=x?x.t*60:0;drawT()}
function drawT(){const s=Math.abs(tLeft),t=(tLeft<0?'-':'')+String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0');$('#tt').textContent=t;$('#tt').classList.toggle('over',tLeft<0);$('#tp').textContent=tInt?'❚❚':'▶'}
$('#tp').onclick=()=>{if(tInt){clearInterval(tInt);tInt=null}else tInt=setInterval(()=>{tLeft--;if(tLeft===0)beep();drawT()},1000);drawT()};
$('#tr').onclick=resetTimer;
$('#bProj').onclick=()=>{document.body.classList.toggle('proj');$('#bProj').textContent=document.body.classList.contains('proj')?'Sair do projetor':'Projetar';if(document.body.classList.contains('proj')&&document.documentElement.requestFullscreen)document.documentElement.requestFullscreen().catch(()=>{})};
document.addEventListener('fullscreenchange',()=>{if(!document.fullscreenElement&&document.body.classList.contains('proj')){document.body.classList.remove('proj');$('#bProj').textContent='Projetar'}});
