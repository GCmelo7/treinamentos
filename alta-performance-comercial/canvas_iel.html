:root{--navy:#0E2A5C;--blue:#1565C0;--turq:#12A3A8;--green:#1DBF8A;--ice:#EAF4FB;--mint:#E8F8F3;--grey:#5A6B85;--line:#D6E1EC;--soft:#F6F9FC;--grad:linear-gradient(90deg,#0E2A5C 0%,#12A3A8 60%,#1DBF8A 100%);--f:Montserrat,system-ui,-apple-system,"Segoe UI",sans-serif}
*{box-sizing:border-box}
body{margin:0;font-family:var(--f);color:var(--navy);background:#EEF3F8;-webkit-font-smoothing:antialiased}
button{font-family:var(--f)}
.topline{height:4px;background:linear-gradient(90deg,var(--blue) 0 66%,#C9D3DE 66% 100%)}
header.site{position:sticky;top:0;z-index:30;background:rgba(255,255,255,.97);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.bar{display:flex;align-items:center;gap:12px;padding:10px 20px;max-width:1560px;margin:0 auto;flex-wrap:wrap}
.brand{display:flex;flex-direction:column;line-height:1.1;text-decoration:none;color:var(--navy)}
.brand b{font-size:12px;letter-spacing:.06em;font-weight:800}.brand span{font-size:11px;color:var(--grey);font-weight:600}
.tabs{display:flex;gap:4px;background:var(--soft);border:1px solid var(--line);border-radius:999px;padding:4px;margin:0 auto;flex-wrap:wrap}
.tabs button{border:0;background:transparent;color:var(--navy);font-weight:800;font-size:12.5px;padding:8px 13px;border-radius:999px;cursor:pointer;display:flex;align-items:center;gap:6px}
.tabs button.on{background:var(--navy);color:#fff}
.tabs i{font-style:normal;font-size:10.5px;font-weight:800;background:var(--ice);color:var(--turq);padding:2px 7px;border-radius:999px}
.tabs button.on i{background:rgba(255,255,255,.18);color:#7FE3E6}
.tools{display:flex;gap:6px;flex-wrap:wrap}
.ib{border:1.5px solid var(--line);background:#fff;color:var(--navy);font-weight:700;font-size:12.5px;padding:8px 12px;border-radius:10px;cursor:pointer;text-decoration:none;white-space:nowrap}
.ib:hover{border-color:var(--turq)}.ib.dark{background:var(--navy);color:#fff;border-color:var(--navy)}
@media(max-width:980px){.tabs{order:3;width:100%;margin:0;justify-content:space-between}.tabs button{flex:1;justify-content:center;padding:8px 6px;font-size:11.5px}.tabs i{display:none}.tabs .w{display:none}}
.wrap{max-width:1560px;margin:0 auto;padding:22px 20px 60px}
.hint{display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:13px;color:var(--grey);margin:0 0 14px}
.hint b{color:var(--navy)}
.saved{font-weight:800;color:var(--green)}
/* ---------- quadro (pôster) ---------- */
.board{background:#fff;border-radius:18px;box-shadow:0 10px 40px rgba(14,42,92,.10);padding:22px 24px 18px;position:relative;overflow:hidden}
.board:before{content:none;x:"";position:absolute;left:24px;right:24px;top:0;height:5px;background:linear-gradient(90deg,var(--blue) 0 66%,#C9D3DE 66% 100%);border-radius:0 0 4px 4px}
.bhead{display:flex;justify-content:space-between;align-items:flex-end;gap:20px;margin:6px 0 14px}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--grad);color:#fff;font-weight:800;font-size:11px;letter-spacing:.07em;text-transform:uppercase;padding:6px 12px;border-radius:999px}
.btitle{font-size:clamp(22px,2.6vw,36px);font-weight:900;letter-spacing:-.015em;margin:8px 0 2px;line-height:1.05}
.hl{background:linear-gradient(transparent 8%,#3ED3D8 8%,#3ED3D8 94%,transparent 94%);border-radius:8px;padding:0 .12em;-webkit-box-decoration-break:clone;box-decoration-break:clone}
.bsub{font-size:13px;color:var(--grey);font-weight:600}
.who{display:grid;grid-template-columns:auto 220px;gap:6px 10px;align-items:center;font-size:11px;font-weight:800;letter-spacing:.06em;color:var(--grey);text-transform:uppercase}
.who .ed{min-height:24px;border-bottom:1.5px solid var(--line);font-size:13px;letter-spacing:0;text-transform:none;color:var(--navy);font-weight:600;padding:2px 2px}
.chev{position:absolute;right:26px;top:16px;color:#D9E1EA;font-weight:900;font-size:46px;letter-spacing:-7px;pointer-events:none}
.grid{display:grid;gap:10px;grid-template-columns:repeat(6,minmax(0,1fr))}
.box{border:1.5px solid var(--line);border-radius:14px;display:flex;flex-direction:column;min-height:0;background:#fff;position:relative}
.box .bh{display:flex;align-items:center;gap:8px;padding:9px 11px 0}
.box .num{flex:none;width:24px;height:24px;border-radius:8px;background:var(--grad);color:#fff;font-size:11.5px;font-weight:900;display:grid;place-items:center}
.box svg{flex:none;width:18px;height:18px;stroke:var(--turq);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.box .bt{font-size:12.5px;font-weight:900;letter-spacing:.05em;text-transform:uppercase;line-height:1.15}
.box .col{position:absolute;top:-8px;left:12px;background:#fff;padding:0 6px;font-size:9.5px;font-weight:900;letter-spacing:.12em;color:var(--turq)}
.box .q{font-size:11px;color:var(--grey);font-weight:600;padding:3px 11px 6px;line-height:1.35}
.box .fl{display:flex;flex-direction:column;gap:6px;padding:0 11px 10px;flex:1;min-height:0}
.box .fl.row{flex-direction:row}.box .fl.row>.fd{flex:1}
.fd{display:flex;flex-direction:column;min-height:0;flex:1}
.fd label{font-size:9.5px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--turq);margin:0 0 2px}
.ed{flex:1;min-height:calc(var(--r,2)*21px);outline:none;font-size:13px;line-height:21px;color:var(--navy);font-weight:500;white-space:pre-wrap;word-break:break-word;overflow:hidden;
 background-image:repeating-linear-gradient(transparent 0 20px,#E3EAF2 20px 21px);background-attachment:local;border-radius:4px;padding:0 2px;cursor:text}
.ed:focus{background-color:#F4FBFB;box-shadow:0 0 0 2px rgba(18,163,168,.25)}
.ed:empty:before{content:attr(data-ph);color:#A9B6C7;font-weight:500}
.box.hl{background:#E3F8F9;border-color:#9FE3E5}.box.hl .ed{background-image:repeating-linear-gradient(transparent 0 20px,#BCEBEC 20px 21px)}
.box.mint{background:var(--mint);border-color:#BFEBDB}.box.mint .ed{background-image:repeating-linear-gradient(transparent 0 20px,#CDEFE2 20px 21px)}
.box.navy{background:var(--navy);border-color:var(--navy);color:#fff}.box.navy .q{color:#9FB3D1}.box.navy svg{stroke:#7FE3E6}
.rules{margin:0;padding:2px 12px 12px 30px;font-size:12px;line-height:1.45;color:#EAF4FB}.rules li{margin:4px 0}
/* fluxo (camada 2) */
.flow .box.fx:after{content:"»";position:absolute;right:-12px;top:42%;width:20px;height:20px;border-radius:50%;background:#fff;border:1.5px solid var(--line);color:var(--turq);font-weight:900;font-size:13px;display:grid;place-items:center;z-index:2;line-height:1}
/* funil */
.fun{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:6px}
.fun .st{position:relative;background:var(--ice);border-radius:10px;padding:6px 8px 4px;clip-path:polygon(0 0,92% 0,100% 50%,92% 100%,0 100%,8% 50%)}
.fun .st:first-child{clip-path:polygon(0 0,92% 0,100% 50%,92% 100%,0 100%)}
.fun .st label{display:block;font-size:9px;font-weight:900;letter-spacing:.05em;text-transform:uppercase;color:var(--navy);padding-left:8%}
.fun .st .ed{min-height:42px;padding-left:8%;background-image:repeating-linear-gradient(transparent 0 20px,#CFE2F2 20px 21px)}
.fun .st:nth-child(2){background:#DDF1F6}.fun .st:nth-child(3){background:#D3F0EC}.fun .st:nth-child(4){background:#D8F5E8}
.fun2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
/* tabela */
table.tb{width:100%;border-collapse:collapse;font-size:12px;margin:0 0 4px}
table.tb th{font-size:9.5px;font-weight:900;letter-spacing:.06em;text-transform:uppercase;color:#fff;background:var(--navy);text-align:left;padding:5px 7px}
table.tb th:first-child{border-radius:8px 0 0 0}table.tb th:last-child{border-radius:0 8px 0 0}
table.tb td{border-bottom:1px solid #E3EAF2;padding:0;vertical-align:top}
table.tb td:first-child{width:38%}
table.tb .ed{min-height:44px;background-image:none;padding:5px 7px;line-height:18px;font-size:12.5px}
table.tb td.rn{width:26px;font-weight:900;color:var(--turq);text-align:center;padding-top:6px}
.bfoot{display:flex;justify-content:space-between;align-items:center;margin-top:10px;font-size:10px;color:var(--grey);font-weight:600}
.bfoot .lg{height:30px}
.ielhead,.ielfoot{display:none}
/* celular: vira lista */
@media screen and (max-width:900px){.board{padding:18px 14px}.bhead{flex-direction:column;align-items:flex-start}.who{grid-template-columns:auto 1fr;width:100%}.grid{display:flex;flex-direction:column}.box{order:var(--o)}.flow .box.fx:after{display:none}.fun{grid-template-columns:1fr 1fr}.fun2{grid-template-columns:1fr}.box .fl.row{flex-direction:column}.chev{display:none}.tw{overflow-x:auto}}
/* impressão: A3 paisagem, uma camada por página */
@page{size:A3 landscape;margin:7mm}
@media print{
 body{background:#fff}
 header.site,.hint,.noprint,.apc-strip,.apc-foot,.apc-who,.mobnav{display:none!important}
 html,body{margin:0!important;padding:0!important}
 .wrap{padding:0;max-width:none}
 .board{box-shadow:none;border-radius:0;padding:4mm 6mm 3mm;width:406mm;height:283mm;display:flex;flex-direction:column}
 .grid{flex:1;min-height:0}
 .box{break-inside:avoid}
 .ed:empty:before{content:""}
 .ed:focus{box-shadow:none}
 .board{print-color-adjust:exact;-webkit-print-color-adjust:exact}
}

function canvasFilled(layer,CV){const k=canvasKeys(layer);return [k.filter(x=>(CV[x]||'').trim()).length,k.length]}

const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const LS={get(k,d){try{const v=localStorage.getItem('apc_'+k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem('apc_'+k,JSON.stringify(v))}catch(e){}}};
const CV=LS.get('canvas',{});
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let cur=(location.hash.slice(1)||'c1'),blank=false;
if(!CANVAS_LAYERS.find(l=>l.id===cur))cur='c1';
function ed(key,ph,rows){const v=blank?'':(CV[key]||'');return `<div class="ed" contenteditable="true" data-k="${key}" data-ph="${esc(ph||'')}" style="--r:${rows||2}">${esc(v)}</div>`}
function ico(n){return `<svg viewBox="0 0 24 24">${CANVAS_ICONS[n]||''}</svg>`}
function boxHTML(L,b,i){
 const fx=L.flow&&['abo','qua','pro','obj','lim'].includes(b.a)?' fx':'';
 let body='';
 if(b.kind==='funil'){const st=b.f.slice(0,4),rest=b.f.slice(4);
  body=`<div class="fun">${st.map(f=>`<div class="st"><label>${esc(f[1])}</label>${ed(f[0],'',2)}</div>`).join('')}</div><div class="fun2">${rest.map(f=>`<div class="fd"><label>${esc(f[1])}</label>${ed(f[0],'',1)}</div>`).join('')}</div>`}
 else if(b.kind==='table'){body=`<div class="tw"><table class="tb"><tr><th></th>${b.cols.map(c=>`<th>${esc(c)}</th>`).join('')}</tr>${Array.from({length:b.rowsN},(x,r)=>`<tr><td class="rn">${r+1}</td>${b.cols.map((c,ci)=>`<td>${ed(`${L.id}_t${r}_${ci}`,'',1)}</td>`).join('')}</tr>`).join('')}</table></div>`}
 else if(b.kind==='rules'){body=`<ol class="rules">${b.rules.map(r=>`<li>${esc(r)}</li>`).join('')}</ol>`}
 else body=b.f.map(f=>`<div class="fd">${f[1]?`<label>${esc(f[1])}</label>`:''}${ed(f[0],b.pull&&!CV[f[0]]&&CV[b.pull]&&!blank?'Toque para trazer da camada anterior':'',f[2])}</div>`).join('');
 const order=typeof b.n==='number'?b.n:(b.n==='★'?0:99);
 return `<section class="box${b.tone?' '+b.tone:''}${fx}" style="grid-area:${b.a};--o:${order}">${b.col?`<span class="col">${esc(b.col)}</span>`:''}<div class="bh"><span class="num">${b.n}</span>${ico(b.ic)}<span class="bt">${esc(b.t)}</span></div><div class="q">${esc(b.q)}</div><div class="fl${b.kind==='row'?' row':''}">${body}</div></section>`}
function hlTitle(t){const w=t.split(' '),k=Math.max(1,Math.ceil(w.length*.4));return esc(w.slice(0,w.length-k).join(' '))+' <span class="hl">'+esc(w.slice(-k).join(' '))+'</span>'}
function render(){
 const L=CANVAS_LAYERS.find(l=>l.id===cur);
 $('#tabs').innerHTML=CANVAS_LAYERS.map(l=>{const [a,b]=canvasFilled(l.id,CV);return `<button class="${l.id===cur?'on':''}" data-l="${l.id}">${l.id==='ci'?'IA':l.id==='cs'?'Síntese':l.id==='icp'?'ICP':'<span class="w">Camada </span>'+l.id[1]}<i>${Math.round(a/b*100)}%</i></button>`}).join('');
 $$('#tabs button').forEach(b=>b.onclick=()=>{cur=b.dataset.l;history.replaceState(null,'','#'+cur);render()});
 $('#board').innerHTML=`<div class="board">${IEL?`<img class="ielhead" src="${IEL.head}" alt="" style="width:100%;margin:-4px 0 4px">`:''}<div class="chev">»</div>
  <div class="bhead"><div><span class="chip">${esc(L.tag)}</span><div class="btitle">${hlTitle(L.titulo)}</div><div class="bsub">${esc(L.nome)} • ${esc(L.sub)}</div></div>
  <div class="who"><span>Nome</span>${ed('cv_nome','',1)}<span>Empresa</span>${ed('cv_empresa','',1)}</div></div>
  <div class="grid${L.flow?' flow':''}" style="grid-template-areas:${L.grid.map(r=>`'${r}'`).join(' ')};grid-template-rows:${L.rows};grid-template-columns:repeat(${L.grid[0].trim().split(/\s+/).length},minmax(0,1fr))">${L.boxes.map((b,i)=>boxHTML(L,b,i)).join('')}</div>
  <div class="bfoot"><span>Use dados mínimos: clientes como “Cliente A”. Números de exemplo são fictícios.</span>${IEL?`<img class="lg" src="${IEL.foot}" alt="">`:'<span>Alta Performance Comercial • Meu Mapa</span>'}</div></div>`;
 let t;$$('.ed').forEach(e=>{
  e.addEventListener('input',()=>{CV[e.dataset.k]=e.innerText.replace(/\n$/,'');LS.set('canvas',CV);$('#saved').textContent='Salvo ✓';clearTimeout(t);t=setTimeout(()=>{$('#saved').textContent='';updTabs()},1200)});
  e.addEventListener('paste',ev=>{ev.preventDefault();const tx=(ev.clipboardData||window.clipboardData).getData('text');document.execCommand('insertText',false,tx)});
  e.addEventListener('focus',()=>{const b=L.boxes.find(x=>x.f.some(f=>f[0]===e.dataset.k));if(b&&b.pull&&!e.innerText.trim()&&(CV[b.pull]||'').trim()){e.innerText=CV[b.pull];CV[e.dataset.k]=CV[b.pull];LS.set('canvas',CV)}})})}
function updTabs(){$$('#tabs button').forEach(b=>{const [a,n]=canvasFilled(b.dataset.l,CV);b.querySelector('i').textContent=Math.round(a/n*100)+'%'})}
$('#bPrint').onclick=()=>window.print();
$('#bBlank').onclick=()=>{blank=true;render();setTimeout(()=>{window.print();blank=false;render()},150)};
$('#bClear').onclick=()=>{if(!confirm('Apagar tudo o que você escreveu nesta camada?'))return;canvasKeys(cur).forEach(k=>delete CV[k]);LS.set('canvas',CV);render()};
window.addEventListener('hashchange',()=>{const h=location.hash.slice(1);if(CANVAS_LAYERS.find(l=>l.id===h)){cur=h;render()}});
